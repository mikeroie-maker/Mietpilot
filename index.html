<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MietPilot</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>MietPilot</h1>

<button onclick="demo()">Demo laden</button>

<h2>Kunden</h2>
<input id="name" placeholder="Name">
<input id="miete" placeholder="Miete">
<button onclick="addKunde()">Speichern</button>
<div id="kundenListe"></div>

<h2>Mietobjekte</h2>
<input id="objekt" placeholder="z.B. Container 1">
<button onclick="addObjekt()">Hinzufügen</button>
<div id="objektListe"></div>

<h2>Zahlungen</h2>
<button onclick="monatStart()">Monat starten</button>
<div id="zahlungenListe"></div>

</body>

<script src="app.js"></script>

</html>

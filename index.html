<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MietPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>MietPilot</h1>
  <p>Version 8.3 · Mehrere Mietpositionen direkt beim Kunden</p>
</header>

<main>

<section id="kunden" class="page active">
  <h2>Kunden</h2>

  <button onclick="neuerKunde()">+ Neuer Kunde</button>

  <div id="kundenForm" class="formular hidden">

    <h3>Kundendaten</h3>
    <input id="kundeName" placeholder="Name">
    <input id="kundeTelefon" placeholder="Telefon">
    <input id="kundeEmail" placeholder="E-Mail">

    <select id="kundeTyp">
      <option value="privat">Privat</option>
      <option value="gewerbe">Gewerbe</option>
    </select>

    <h3>Mietpositionen</h3>
    <div id="draftPositionenListe"></div>

    <button onclick="draftPositionHinzufuegen()">+ Mietposition hinzufügen</button>

    <br><br>
    <button onclick="kundeSpeichern()">Speichern</button>
    <button onclick="kundenFormSchliessen()">Abbrechen</button>

  </div>

  <div id="kundenListe"></div>

</section>

</main>

<script src="app.js"></script>
</body>
</html>
